<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professional Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="game-container">
    <header class="header">
      <h1>Tic Tac Toe</h1>
      <p class="subtitle">The Classic Game</p>
    </header>

    <div class="scoreboard">
      <div class="score-card player-x active">
        <span class="player-label">Player X</span>
        <span class="score-value" id="scoreX">0</span>
      </div>
      <div class="score-card player-o">
        <span class="player-label">Player O</span>
        <span class="score-value" id="scoreO">0</span>
      </div>
    </div>

    <div class="board" id="board">
      <div class="cell" data-index="0"></div>
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
    </div>

    <div class="game-footer">
      <div class="message" id="message">Player X's Turn</div>
    </div>
  </div>

  <!-- Modal Popup -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <h2 class="modal-title" id="modalTitle">Player X Wins! 🎉</h2>
      <p class="modal-subtitle" id="modalSubtitle">Great job, you outsmarted your opponent!</p>
      <button class="btn" id="replayBtn">Play Again</button>
    </div>
  </div>

  <script src="./style.js"></script>
</body>

</html>
